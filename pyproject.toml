[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GSprimer"
version = "1.1.0"
description = "CDS-amplification primer design for GS / Golden Gate (BsaI/PaqCI) vector cloning"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Fang Lab, Hainan University" }]
keywords = [
    "primer-design", "golden-gate", "gs-cloning", "bsai", "paqci",
    "cds", "molecular-cloning", "plant-molecular-biology", "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/your-org/GSprimer"
Repository = "https://github.com/your-org/GSprimer"
Issues = "https://github.com/your-org/GSprimer/issues"

[project.scripts]
gsprimer = "gsprimer.cli:main"

[tool.setuptools]
packages = ["gsprimer"]

[tool.setuptools.package-data]
gsprimer = ["py.typed"]
